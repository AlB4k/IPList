name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build Windows/IPList.Windows.sln -c Release
      - name: Test Core
        run: dotnet test Windows/tests/IPList.Core.Tests/IPList.Core.Tests.csproj -c Release --no-build
      - name: Publish self-contained app
        run: dotnet publish Windows/src/IPList.App/IPList.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/publish
      - name: Verify and package
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/publish/IPList.exe -PathType Leaf)) { throw 'IPList.exe missing' }
          if ((Get-Item artifacts/publish/IPList.exe).Length -eq 0) { throw 'IPList.exe is empty' }
          $forbiddenExtensions = @('.vpn', '.conf', '.key', '.pem', '.p12', '.pfx')
          $forbiddenFiles = Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $forbiddenExtensions -contains $_.Extension.ToLowerInvariant() }
          if ($forbiddenFiles) { throw "Personal config or key material found in publish output: $($forbiddenFiles.FullName -join ', ')" }
          if (Get-ChildItem artifacts/publish -Recurse -Directory | Where-Object { $_.Name -eq 'Fixtures' }) { throw 'Test fixtures found in publish output' }
          $rawResources = @('pincetgore-config.yaml', 'iplist-service-overrides.json', 'enrichment-snapshot.json')
          if (Get-ChildItem artifacts/publish -Recurse -File | Where-Object { $rawResources -contains $_.Name }) { throw 'Bundled resources must remain embedded' }
          Copy-Item Windows/README.md artifacts/publish/README.md
          Copy-Item Windows/THIRD_PARTY_NOTICES.md artifacts/publish/THIRD_PARTY_NOTICES.md
          Compress-Archive -Path artifacts/publish/* -DestinationPath IPList-1.5.0-windows-x64.zip
          $archive = 'IPList-1.5.0-windows-x64.zip'
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$archive" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: IPList-1.5.0-windows-x64
          path: |
            IPList-1.5.0-windows-x64.zip
            SHA256SUMS.txt
      - name: Upload 1.5.0 release assets
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.5.0 IPList-1.5.0-windows-x64.zip SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
